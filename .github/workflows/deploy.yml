name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ==================== pnpm 设置 ====================
      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 20
          cache: "pnpm"
          cache-dependency-path: ./pnpm-lock.yaml

      # ==================== 安装依赖 ====================
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Approve builds (esbuild & sharp)
        run: pnpm approve-builds esbuild sharp

      # ==================== Git 信息与构建时间 ====================
      - name: Get Git info and Build Time
        id: git_info
        run: |
          echo "COMMIT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "COMMIT_DATE=$(git log -1 --pretty=format:%cd --date=iso)" >> $GITHUB_ENV
          echo "BUILD_TIME=$(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_ENV

      # ==================== 构建 ====================
      - name: Build static export
        run: pnpm build
        env:
          NEXT_PUBLIC_LAST_FM_API_KEY: ${{ secrets.NEXT_PUBLIC_LAST_FM_API_KEY }}
          NEXT_PUBLIC_LAST_FM_USERNAME: ${{ secrets.NEXT_PUBLIC_LAST_FM_USERNAME }}
          NEXT_PUBLIC_GITHUB_TOKEN: ${{ secrets.NEXT_PUBLIC_GITHUB_TOKEN }}
          NEXT_PUBLIC_BUILD_TIME: ${{ env.BUILD_TIME }}
          NEXT_PUBLIC_COMMIT_DATE: ${{ env.COMMIT_DATE }}
          NEXT_PUBLIC_COMMIT_SHA: ${{ env.COMMIT_SHA }}

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  # ==================== 部署 ====================
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4